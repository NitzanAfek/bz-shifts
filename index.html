<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#2f5fd0"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="בונקר"><style>body{margin:0}</style></head><body>
<div id="app" hidden><title>בונקר צנובר</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600&family=Assistant:wght@400;600;700&display=swap">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2433;--muted:#667085;--faint:#98a2b3;--line:#e6e9ef;--soft:#f8f9fb;
--acc:#2f5fd0;--accbg:#e8eefc;--note:#7a4fd6;--notebg:#f3eefe;--swap:#b86e00;--swapbg:#fff3df;--bad:#c4321c;--badbg:#fdecea;--good:#1f8a4c;--goodbg:#e7f5ec;
--p1:#2f6fb3;--p2:#1f8a70;--p3:#c0602f;--p4:#6d4fb8;--shadow:0 1px 2px rgba(16,24,40,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#11151d;--card:#191f2a;--ink:#e7ebf2;--muted:#a3adbd;--faint:#6f7a8c;--line:#2a3140;--soft:#1d2430;--acc:#8fb0ff;--accbg:#22314f;--note:#b79bff;--notebg:#2a2342;--swap:#f2b04a;--swapbg:#3a2c12;--bad:#ff8a75;--badbg:#3d1d18;--good:#5fd08f;--goodbg:#173426;--p1:#6fa8e8;--p2:#4cc3a2;--p3:#ec9466;--p4:#a88cf0;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#11151d;--card:#191f2a;--ink:#e7ebf2;--muted:#a3adbd;--faint:#6f7a8c;--line:#2a3140;--soft:#1d2430;--acc:#8fb0ff;--accbg:#22314f;--note:#b79bff;--notebg:#2a2342;--swap:#f2b04a;--swapbg:#3a2c12;--bad:#ff8a75;--badbg:#3d1d18;--good:#5fd08f;--goodbg:#173426;--p1:#6fa8e8;--p2:#4cc3a2;--p3:#ec9466;--p4:#a88cf0;--shadow:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
#static{display:flex;flex-direction:column;gap:12px}
body{background:var(--bg);color:var(--ink);font-family:Assistant,Arial,sans-serif;font-size:16px;line-height:1.5;direction:rtl}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 110px;padding-inline:16px;display:flex;flex-direction:column;gap:14px}
h1{font-family:Rubik,Arial,sans-serif;font-weight:600;font-size:22px;margin:0}
h2{font-family:Rubik,Arial,sans-serif;font-weight:600;font-size:18px;margin:0}
h3{font-size:15px;margin:0;color:var(--muted);font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub{color:var(--muted);font-size:14px;margin:0}
.mebtn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card.flush{padding:0;gap:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px}
.pill.ok{background:var(--goodbg);color:var(--good)}.pill.sw{background:var(--swapbg);color:var(--swap)}.pill.bad{background:var(--badbg);color:var(--bad)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.now{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.now .card{gap:2px;padding:12px 14px}
.now .post{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-weight:600}
.now .who{font-size:20px;font-weight:700}
.now .till{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.big{font-family:Rubik,Arial,sans-serif;font-size:28px;font-weight:600;line-height:1.2}
.alert{border-radius:12px;padding:10px 14px;font-size:14px}
.alert.sw{background:var(--swapbg);color:var(--ink);border:1px solid var(--swap)}
.alert.bad{background:var(--badbg);border:1px solid var(--bad)}
.alert ul{margin:4px 0 0;padding-inline-start:18px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 0;min-height:48px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.days button span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.days button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--card)}
.days button[aria-selected="true"] span{color:var(--card)}
.days button.today{border-color:var(--acc)}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th,td{padding:10px 4px;text-align:center;vertical-align:top;font-size:15px;word-break:break-word}
thead th{font-size:14px;font-weight:600;border-bottom:1px solid var(--line)}
thead .dot{display:block;margin:0 auto 4px}
tbody tr+tr th,tbody tr+tr td{border-top:1px solid var(--line)}
tbody th{width:64px;text-align:start;padding-inline-start:12px;font-weight:600}
tbody th small{display:block;font-weight:400;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
tr.off th,tr.off td{background:var(--soft);color:var(--muted);font-size:13px}
td.sw{background:var(--swapbg)}td.nt{background:var(--notebg)}
td small{display:block;font-size:11px;line-height:1.3;margin-top:2px}
td.sw small{color:var(--swap)}td.nt small{color:var(--note)}
.n.me{background:var(--acc);color:var(--card);border-radius:6px;padding:1px 5px;font-weight:700}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 16px}
.list li+li{border-top:1px solid var(--line)}
.list .d{width:56px;flex:none;font-weight:600}.list .d span{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.list .s{flex:1;min-width:0;font-weight:600}.list .s span{display:block;font-weight:400;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.list .warn{color:var(--bad);font-size:12px;font-weight:600}
.cal{font-size:13px;color:var(--acc);text-decoration:none;white-space:nowrap;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--soft);border-radius:10px;padding:10px 4px}
.stats b{display:block;font-family:Rubik,Arial,sans-serif;font-size:24px}
.stats span{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;font:inherit;font-weight:600;border:0;background:none;color:var(--muted);padding:9px 6px;border-radius:8px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
select,textarea,input[type=text],input[type=number]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip small{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--card);border-color:var(--acc)}
.chip[aria-pressed="true"] small{color:var(--card)}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;font:inherit;color:var(--ink);text-align:start;width:100%;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card)}
.opt[aria-pressed="true"]{border-color:var(--acc);background:var(--accbg)}
.opt .s{flex:1}.opt .s span{display:block;font-size:13px;color:var(--muted)}
.grid7{display:grid;grid-template-columns:52px repeat(4,1fr) 56px;gap:4px;align-items:center;font-size:13px}
.grid7 .h{text-align:center;color:var(--muted);font-weight:600}
.grid7 .dn{font-weight:600;line-height:1.1}.grid7 .dn span{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.tg{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;min-height:40px;cursor:pointer}
.tg[aria-pressed="true"]{background:var(--badbg);border-color:var(--bad);color:var(--bad);font-weight:700}
.preview{white-space:pre-wrap;background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:14px;max-height:260px;overflow:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;text-decoration:none;text-align:center;flex:1;min-width:140px}
.btn.wa{background:#1f9d55;color:#fff}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.pri{background:var(--acc);color:var(--card)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.hint{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:18px}
.tw{overflow-x:auto}
.tabs{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{font:inherit;font-size:12px;font-weight:600;border:0;background:none;color:var(--muted);padding:8px 2px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--acc)}
button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sheet{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet .card{width:100%;max-width:520px;border-radius:18px 18px 0 0;max-height:80vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:10}
@media (max-width:420px){.now{grid-template-columns:1fr 1fr}.now .who{font-size:18px}th,td{font-size:14px}}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .15s ease}}
@keyframes fade{from{opacity:.6}to{opacity:1}}
</style>

<div class="wrap">
  <div class="top">
    <div><h1>בונקר צנובר</h1><p class="sub" id="weeklbl"></p></div>
    <button class="mebtn" id="mebtn" type="button" hidden>מי אני?</button>
  </div>
  <main id="view" class="view"></main>
  <div id="static"></div>
</div>

<nav class="tabs" role="tablist" id="tabs" hidden>
  <button type="button" role="tab" data-t="now"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>עכשיו</button>
  <button type="button" role="tab" data-t="week"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>סידור</button>
  <button type="button" role="tab" data-t="mine"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>שלי</button>
  <button type="button" role="tab" data-t="ask"><svg viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>בקשות</button>
  <button type="button" role="tab" data-t="plan"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/><path d="M17 15l2 2 3-4"/></svg>שיבוץ</button>
</nav>

</div><div id="lock" class="wrap" hidden><div class="card" style="margin-top:12vh;text-align:center;align-items:center">
<img src="icon-192.png" alt="" width="72" height="72" style="border-radius:16px">
<h1>בונקר צנובר</h1><p class="hint" id="lockmsg">הקלידו את קוד הכניסה שקיבלתם מראש הצוות</p>
<form id="lockform" style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px">
<input id="lockcode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="••••••" style="text-align:center;font-size:22px;letter-spacing:6px">
<button class="btn pri" type="submit" id="lockbtn">כניסה</button></form></div></div><script>
function BOOT(DATA){
document.getElementById("app").hidden = false;


// ---------- model ----------
const SH = ["בוקר","צהריים","ערב","לילה"];
const DAYN = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const EARLY = {"326":true,"ש״ג":true};               // these posts start 15 min earlier
const START = [7,13,19,25];
const pad = n => String(n).padStart(2,"0");
const W0 = new Date(DATA.week_start + "T00:00:00");
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const dm = d => d.getDate() + "." + (d.getMonth()+1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nameOf = c => typeof c === "string" ? c : c.t;
const posts = DATA.posts;
const firstTok = s => s.split(/[ ,]/)[0].replace("יי","י");
const same = (a,b) => a === b || firstTok(a) === firstTok(b);

function slotTime(post, day, s){
  // wall-clock hours, so the DST change (25.10) does not shift shifts by an hour
  const y = W0.getFullYear(), m = W0.getMonth(), d = W0.getDate() + day;
  const start = EARLY[post] ? new Date(y, m, d, START[s] - 1, 45) : new Date(y, m, d, START[s], 0);
  const end = new Date(y, m, d, START[s] + 6, 0);
  return {start, end};
}
const hhmm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
const hoursTxt = (post, day, s) => { const t = slotTime(post, day, s); return hhmm(t.start) + "-" + hhmm(t.end); };

// every shift in the week, flattened
const SLOTS = [];
posts.forEach(p => p.rows.slice(0,4).forEach((row, s) => row[2].forEach((c, day) => {
  const t = slotTime(p.name, day, s);
  SLOTS.push({post:p.name, color:p.color, day, s, who:nameOf(c), cell:c, ...t});
})));
const PEOPLE = [...new Set(posts.flatMap(p => p.rows.flatMap(r => r[2].flatMap(c => nameOf(c).split(", ")))))].sort((a,b)=>a.localeCompare(b,"he"));
const postOf = name => { for (const p of posts) if (p.rows.some(r => r[2].some(c => nameOf(c).split(", ").some(n => same(n,name))))) return p.name; return ""; };
const isWeekend = (day, s) => day >= 5 || (day === 4 && s >= 2);
const myShifts = me => SLOTS.filter(x => same(x.who, me)).sort((a,b)=>a.start-b.start);

// ---------- state ----------
const store = { get(k,d){ try { const v = localStorage.getItem("bz_"+k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
                set(k,v){ try { localStorage.setItem("bz_"+k, JSON.stringify(v)); } catch(e){} } };
let me = store.get("me", "");
let tab = store.get("tab", "now");
const nowD = new Date();
let day = (nowD >= W0 && nowD < addDays(W0,7)) ? Math.floor((nowD - W0) / 864e5) : 0;
let askMode = "swap";

const view = document.getElementById("view");
document.getElementById("weeklbl").textContent = "שבוע " + dm(W0) + " עד " + dm(addDays(W0,6)) + " · עודכן " + DATA.updated;

function toast(t){ const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(()=>el.remove(), 1800); }
async function copy(text){
  try { await navigator.clipboard.writeText(text); toast("הועתק"); }
  catch(e){ const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast("הועתק"); }catch(_){ toast("סמן והעתק ידנית"); } ta.remove(); }
}
const waLink = text => "https://wa.me/?text=" + encodeURIComponent(text);

// ---------- who am I ----------
function pickMe(){
  const sh = document.createElement("div"); sh.className = "sheet";
  sh.innerHTML = `<div class="card"><h2>מי אתה?</h2><p class="hint">נשמר רק בטלפון שלך. בלי סיסמה.</p>
    <div class="chips">${PEOPLE.map(n=>`<button type="button" class="chip" aria-pressed="${n===me}">${esc(n)} <small>${esc(postOf(n))}</small></button>`).join("")}</div>
    <button type="button" class="btn sec" id="closeMe">סגור</button></div>`;
  document.body.appendChild(sh);
  sh.querySelectorAll(".chip").forEach((b,i)=>b.onclick=()=>{ me = PEOPLE[i]; store.set("me", me); sh.remove(); render(); });
  sh.querySelector("#closeMe").onclick = () => sh.remove();
  sh.onclick = e => { if (e.target === sh) sh.remove(); };
}
document.getElementById("mebtn").onclick = pickMe;

// ---------- views ----------
function viewNow(){
  const now = new Date();
  let h = "";
  const swaps = DATA.applied.length;
  h += swaps ? `<div class="alert sw"><b>${swaps === 1 ? "החלפה אחת" : swaps + " החלפות"} השבוע</b> מהקבוצה, כבר בטבלה (בכתום).<ul>${DATA.applied.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>`
             : `<span class="pill ok">✓ אין החלפות השבוע</span>`;
  if (DATA.flags.length) h += `<div class="alert bad"><b>לבדיקה מול ראש הצוות</b> (לא עודכן בטבלה)<ul>${DATA.flags.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>`;

  const on = posts.map(p => SLOTS.find(x => x.post === p.name && x.start <= now && now < x.end));
  if (on.some(Boolean)) {
    h += `<h2>במשמרת עכשיו</h2><div class="now">` + posts.map((p,i)=>{ const x = on[i];
      return `<div class="card"><div class="post"><i class="dot" style="background:var(${p.color})"></i>${esc(p.name)}</div>
        <div class="who">${x ? `<span class="n${same(x.who,me)?" me":""}">${esc(x.who)}</span>` : "—"}</div>
        <div class="till">${x ? SH[x.s] + " · עד " + hhmm(x.end) : ""}</div></div>`; }).join("") + `</div>`;
  } else {
    h += `<div class="card"><h2>${now < W0 ? "הסידור מתחיל ביום ראשון " + dm(W0) : "השבוע הזה הסתיים"}</h2><p class="hint">${now < W0 ? "הנה מי פותח:" : "מחכה לסידור החדש."}</p>
      ${now < W0 ? `<div class="now">${posts.map(p=>{ const x = SLOTS.find(y=>y.post===p.name && y.day===0 && y.s===0);
        return `<div class="card"><div class="post"><i class="dot" style="background:var(${p.color})"></i>${esc(p.name)}</div><div class="who">${esc(x.who)}</div><div class="till">מ־${hhmm(x.start)}</div></div>`; }).join("")}</div>` : ""}</div>`;
  }

  if (me) {
    const next = myShifts(me).find(x => x.end > now);
    if (next) {
      const hrs = Math.max(0, (next.start - now) / 36e5);
      const when = next.start <= now ? "עכשיו במשמרת" : hrs < 24 ? `בעוד ${Math.floor(hrs)} ש׳ ${Math.round((hrs%1)*60)} ד׳` : `בעוד ${Math.round(hrs/24)} ימים`;
      h += `<div class="card"><h3>המשמרת הבאה שלך</h3><div class="big">${DAYN[next.day]} ${dm(addDays(W0,next.day))} · ${SH[next.s]}</div>
        <div class="hint"><i class="dot" style="background:var(${next.color})"></i> עמדה ${esc(next.post)} · ${hhmm(next.start)}-${hhmm(next.end)} · <b>${when}</b></div></div>`;
    } else h += `<div class="card"><h3>המשמרת הבאה שלך</h3><p class="hint">אין לך עוד משמרות השבוע.</p></div>`;
  } else h += `<button type="button" class="btn pri" id="setme">בחר את השם שלך כדי לראות את המשמרות שלך</button>`;
  view.innerHTML = h;
  const sm = document.getElementById("setme"); if (sm) sm.onclick = pickMe;
}

function viewWeek(){
  const today = new Date();
  let h = `<div class="days" role="tablist">${DAYN.map((d,i)=>{ const dt = addDays(W0,i);
    const isT = today >= dt && today < addDays(dt,1);

function candidates(x){
  const avg = PEOPLE.reduce((a,n)=>a+myShifts(n).length,0) / PEOPLE.length;
  return PEOPLE.filter(n => !same(n, me)).map(n => {
    const mine = myShifts(n);
    if (mine.some(y => y.day === x.day)) return null;                 // already works that day
    const gapBefore = Math.min(...mine.filter(y => y.end <= x.start).map(y => (x.start - y.end)/36e5), 99);
    const gapAfter  = Math.min(...mine.filter(y => y.start >= x.end).map(y => (y.start - x.end)/36e5), 99);
    const rest = Math.min(gapBefore, gapAfter);
    if (rest < 8) return null;                                         // would break minimum rest
    const why = [], postN = postOf(n);
    let score = 0;
    const offRow = posts.find(p => p.name === postN)?.rows[4][2][x.day];
    if (offRow && nameOf(offRow).split(", ").some(o => same(o, n))) { why.push("ביום חופש באותו יום"); score += 3; }
    if (postN === x.post) { why.push("מכיר את העמדה"); score += 2; }
    if (mine.length < avg - 0.4) { why.push(`רק ${mine.length} משמרות השבוע`); score += 2; }
    if (x.s === 3) { const nt = mine.filter(y=>y.s===3).length; if (nt === 0) { why.push("אין לו לילות השבוע"); score += 2; } }
    if (rest >= 24) { why.push("לא צמוד למשמרת אחרת שלו"); score += 1; }
    else why.push(`${Math.round(rest)} ש׳ מנוחה מהמשמרת הקרובה שלו`);
    const cov = (DATA.cover || {})[n] || 0;
    if (cov >= 2) { why.push(`כבר החליף אחרים ${cov} פעמים`); score += 1; }
    return { n, why, score, post: postN };
  }).filter(Boolean).sort((a,b) => b.score - a.score || a.n.localeCompare(b.n,"he"));
}

// ---- team lead: smart roster per team ----
const LEADS = [["אלירן","אלירן"],["זהר","זהר"],["חי","חי"],["שוקי","שלום אטד"]];   // [team label, lead as written in the roster]

const TEAMS = LEADS.map(([label, lead]) => {
  const p = posts.find(p => p.rows.some(r => r[2].some(c => nameOf(c).split(", ").some(n => same(n, lead)))));
  const cnt = {};
  if (p) p.rows.forEach(r => r[2].forEach(c => nameOf(c).split(", ").forEach(n => cnt[n] = (cnt[n]||0) + 1)));
  return { label, lead, post: p ? p.name : "", members: Object.keys(cnt).filter(n => cnt[n] >= 2).sort((a,b)=>a.localeCompare(b,"he")) };
});
function parseCons(text){
  const res = {};   // name -> Set("d-s")
  for (const b of text.split(/פורמט אילוצים/).slice(1)) {
    const nm = (b.match(/שם\s*:\s*(.+)/) || [])[1]; if (!nm) continue;
    const set = res[nm.trim()] = res[nm.trim()] || new Set();
    for (const line of b.split("\n")) {
      if (!/לא יכול/.test(line)) continue;
      let d = DAYN.findIndex(n => line.includes(n));
      const md = line.match(/(\d{1,2})\.(\d{1,2})/);
      if (md) { const dt = new Date(NW0.getFullYear(), +md[2]-1, +md[1]); const k = Math.round((dt - NW0)/864e5); if (k >= 0 && k < 7) d = k; }
      if (d < 0) continue;
      const ss = /כל היום/.test(line) ? [0,1,2,3] : [0,1,2,3].filter(s => line.includes(SH[s]) || (s===1 && line.includes("צהרים")));
      ss.forEach(s => set.add(d+"-"+s));
    }
  }
  return res;
}
// This week's load per person, so next week evens it out (nights, weekends, rest across Saturday night)
function carry(n){
  const m = myShifts(n);
  const last = m.length ? m[m.length-1] : null;
  return { nt: m.filter(x=>x.s===3).length, we: m.filter(x=>isWeekend(x.day,x.s)).length,
           lastEnd: last ? (last.end - NW0) / 36e5 : -99 };     // hours relative to next Sunday 00:00
}
function buildRoster(team, consMap, minRest){
  const slots = []; for (let d = 0; d < 7; d++) for (let s = 0; s < 4; s++) slots.push({d, s, st: d*24 + START[s], en: d*24 + START[s] + 6, we: isWeekend(d, s)});
  const blocked = (n, k) => Object.entries(consMap).some(([cn, set]) => same(cn, n) && set.has(k));
  const C = Object.fromEntries(team.map(n => [n, carry(n)]));
  const avgNt = team.reduce((a,n)=>a+C[n].nt,0)/team.length, avgWe = team.reduce((a,n)=>a+C[n].we,0)/team.length;
  const var_ = a => { const m = a.reduce((p,c)=>p+c,0)/a.length; return a.reduce((p,c)=>p+(c-m)**2,0); };
  // full score of an assignment: hard rules first, then fairness (counting this week's carry-over)
  function evaluate(out){
    const st = Object.fromEntries(team.map(n => [n, {cnt:0, nt:0, we:0, days:new Set(), shifts:[]}]));
    let hard = 0, soft = 0; const warns = [];
    out.forEach((n, i) => { if (n === "—") { hard++; warns.push(`${DAYN[slots[i].d]} ${SH[slots[i].s]}: לא שובץ אף אחד`); return; }
      const sl = slots[i], x = st[n];
      if (blocked(n, sl.d+"-"+sl.s)) { hard++; warns.push(`${n}: ${DAYN[sl.d]} ${SH[sl.s]} נגד אילוץ`); }
      if (x.days.has(sl.d)) { hard++; warns.push(`${n}: שתי משמרות ב${DAYN[sl.d]}`); }
      x.days.add(sl.d); x.cnt++; if (sl.s===3) x.nt++; if (sl.we) x.we++; x.shifts.push(sl); });
    for (const n of team) {
      const sh = st[n].shifts.sort((a,b)=>a.st-b.st); let prevEnd = C[n].lastEnd, prevNight = false, run = 0;
      for (const sl of sh) {
        const gap = sl.st - prevEnd;
        if (gap < minRest) { hard++; warns.push(`${n}: רק ${Math.round(gap)} ש׳ מנוחה לפני ${DAYN[sl.d]} ${SH[sl.s]}`); }
        else if (gap < 16) soft += 2;                                   // legal but short turnaround
        run = sl.s===3 && prevNight ? run + 1 : (sl.s===3 ? 1 : 0); if (run >= 3) soft += 6;   // 3 nights in a row
        prevNight = sl.s === 3 && gap < 30; prevEnd = sl.en;
      }
    }
    const v = team.map(n => st[n]);
    soft += var_(v.map(x=>x.cnt))*6 + var_(v.map((x,i)=>x.nt + C[team[i]].nt - avgNt))*4 + var_(v.map((x,i)=>x.we + C[team[i]].we - avgWe))*3;
    return { cost: hard*1000 + soft, hard, warns, st };
  }
  // 1) many randomized greedy starts  2) improve the best by swapping people between slots
  let best = null;
  for (let run = 0; run < 150; run++) {
    const st = Object.fromEntries(team.map(n => [n, {cnt:0, nt:C[n].nt, we:C[n].we, last:C[n].lastEnd, days:new Set()}]));
    const out = slots.map(sl => {
      const pool = team.filter(n => !blocked(n, sl.d+"-"+sl.s) && !st[n].days.has(sl.d) && sl.st - st[n].last >= minRest);
      if (!pool.length) return "—";
      const sc = n => st[n].cnt*10 + (sl.s===3 ? st[n].nt*8 : 0) + (sl.we ? st[n].we*6 : 0) + Math.random()*5;
      const n = pool.sort((a,b)=>sc(a)-sc(b))[0], x = st[n];
      x.cnt++; if (sl.s===3) x.nt++; if (sl.we) x.we++; x.last = sl.en; x.days.add(sl.d); return n;
    });
    const e = evaluate(out);
    if (!best || e.cost < best.cost) best = {...e, out};
  }
  for (let it = 0; it < 4000; it++) {
    const out = best.out.slice(), i = Math.floor(Math.random()*out.length);
    if (Math.random() < 0.5) { const j = Math.floor(Math.random()*out.length); [out[i], out[j]] = [out[j], out[i]]; }
    else out[i] = team[Math.floor(Math.random()*team.length)];
    const e = evaluate(out); if (e.cost <= best.cost) best = {...e, out};
  }
  best.carry = C;
  return best;
}
function rosterText(label, team, out){
  let t = `*סידור צוות ${label} · ${dm(NW0)}-${dm(addDays(NW0,6))}*\n`;
  for (let d = 0; d < 7; d++) {
    const w = [0,1,2,3].map(s => out[d*4+s]);
    const off = team.filter(n => !w.includes(n));
    t += `\n*${DAYN[d]} ${dm(addDays(NW0,d))}*\n` + SH.map((s,i)=>`${s}: ${w[i]}`).join(" | ") + (off.length ? `\nחופש: ${off.join(", ")}` : "");
  }
  return t;
}

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(enc, code){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64d(enc.salt), iterations:enc.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(enc.iv)}, key, b64d(enc.ct))));
}
const lsGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e) {} };
(async function start(){
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

    const code = document.getElementById("lockcode").value.trim(), btn = document.getElementById("lockbtn");

    catch(e) { btn.textContent = "כניסה"; msg.textContent = "הקוד לא נכון. נסו שוב."; msg.style.color = "var(--bad)"; }
  };
})();
