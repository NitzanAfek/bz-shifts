<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#2f5fd0"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="בונקר"><style>body{margin:0}</style></head><body>
<div id="app" hidden><title>בונקר צנובר</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600&family=Assistant:wght@400;600;700&display=swap">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2433;--muted:#667085;--faint:#98a2b3;--line:#e6e9ef;--soft:#f8f9fb;
--acc:#2f5fd0;--accbg:#e8eefc;--note:#7a4fd6;--notebg:#f3eefe;--swap:#b86e00;--swapbg:#fff3df;--live:#0f7a6b;--livebg:#dff5f0;--bad:#c4321c;--badbg:#fdecea;--good:#1f8a4c;--goodbg:#e7f5ec;
--p1:#2f6fb3;--p2:#1f8a70;--p3:#c0602f;--p4:#6d4fb8;--shadow:0 1px 2px rgba(16,24,40,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#11151d;--card:#191f2a;--ink:#e7ebf2;--muted:#a3adbd;--faint:#6f7a8c;--line:#2a3140;--soft:#1d2430;--acc:#8fb0ff;--accbg:#22314f;--note:#b79bff;--notebg:#2a2342;--swap:#f2b04a;--swapbg:#3a2c12;--live:#4fd1b9;--livebg:#123a33;--bad:#ff8a75;--badbg:#3d1d18;--good:#5fd08f;--goodbg:#173426;--p1:#6fa8e8;--p2:#4cc3a2;--p3:#ec9466;--p4:#a88cf0;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#11151d;--card:#191f2a;--ink:#e7ebf2;--muted:#a3adbd;--faint:#6f7a8c;--line:#2a3140;--soft:#1d2430;--acc:#8fb0ff;--accbg:#22314f;--note:#b79bff;--notebg:#2a2342;--swap:#f2b04a;--swapbg:#3a2c12;--live:#4fd1b9;--livebg:#123a33;--bad:#ff8a75;--badbg:#3d1d18;--good:#5fd08f;--goodbg:#173426;--p1:#6fa8e8;--p2:#4cc3a2;--p3:#ec9466;--p4:#a88cf0;--shadow:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
#static{display:flex;flex-direction:column;gap:12px}
body{background:var(--bg);color:var(--ink);font-family:Assistant,Arial,sans-serif;font-size:16px;line-height:1.5;direction:rtl}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 110px;padding-inline:16px;display:flex;flex-direction:column;gap:14px}
h1{font-family:Rubik,Arial,sans-serif;font-weight:600;font-size:22px;margin:0}
h2{font-family:Rubik,Arial,sans-serif;font-weight:600;font-size:18px;margin:0}
h3{font-size:15px;margin:0;color:var(--muted);font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub{color:var(--muted);font-size:14px;margin:0}
.mebtn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card.flush{padding:0;gap:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px}
.pill.ok{background:var(--goodbg);color:var(--good)}.pill.sw{background:var(--swapbg);color:var(--swap)}.pill.bad{background:var(--badbg);color:var(--bad)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.now{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.now .card{gap:2px;padding:12px 14px}
.now .post{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-weight:600}
.now .who{font-size:20px;font-weight:700}
.now .till{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.big{font-family:Rubik,Arial,sans-serif;font-size:28px;font-weight:600;line-height:1.2}
.alert{border-radius:12px;padding:10px 14px;font-size:14px}
.alert.sw{background:var(--swapbg);color:var(--ink);border:1px solid var(--swap)}
.alert.bad{background:var(--badbg);border:1px solid var(--bad)}
.alert ul{margin:4px 0 0;padding-inline-start:18px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.tsel{display:flex;flex-wrap:wrap;gap:6px}.tsel .chip{font-size:13px}
table.twk{table-layout:fixed;width:100%}table.twk th,table.twk td{font-size:12px;padding:6px 1px;text-align:center;line-height:1.25}
table.twk thead th:first-child,table.twk tbody th{width:52px}table.twk th small{display:block;font-weight:400;font-size:10px;color:var(--muted)}
table.twk th.tday{color:var(--acc)}table.twk .n.me{font-weight:800}
.days button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 0;min-height:48px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.days button span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.days button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--card)}
.days button[aria-selected="true"] span{color:var(--card)}
.days button.today{border-color:var(--acc)}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th,td{padding:10px 4px;text-align:center;vertical-align:top;font-size:15px;word-break:break-word}
thead th{font-size:14px;font-weight:600;border-bottom:1px solid var(--line)}
thead .dot{display:block;margin:0 auto 4px}
tbody tr+tr th,tbody tr+tr td{border-top:1px solid var(--line)}
tbody th{width:64px;text-align:start;padding-inline-start:12px;font-weight:600}
tbody th small{display:block;font-weight:400;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
tr.off th,tr.off td{background:var(--soft);color:var(--muted);font-size:13px}
td.sw{background:var(--swapbg)}td.nt{background:var(--notebg)}td.lv{background:var(--livebg)}td.lv small{color:var(--live)}
.ok-ck{color:var(--live);font-size:12px;font-weight:600}
.alert.lv{background:var(--livebg);border:1px solid var(--live)}
td small{display:block;font-size:11px;line-height:1.3;margin-top:2px}
td.sw small{color:var(--swap)}td.nt small{color:var(--note)}
.n.me{background:var(--acc);color:var(--card);border-radius:6px;padding:1px 5px;font-weight:700}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 16px}
.list li+li{border-top:1px solid var(--line)}
.list .d{width:56px;flex:none;font-weight:600}.list .d span{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.list .s{flex:1;min-width:0;font-weight:600}.list .s span{display:block;font-weight:400;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.list .warn{color:var(--bad);font-size:12px;font-weight:600}
.cal{font-size:13px;color:var(--acc);text-decoration:none;white-space:nowrap;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--soft);border-radius:10px;padding:10px 4px}
.stats b{display:block;font-family:Rubik,Arial,sans-serif;font-size:24px}
.stats span{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;font:inherit;font-weight:600;border:0;background:none;color:var(--muted);padding:9px 6px;border-radius:8px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
select,textarea,input[type=text],input[type=number]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip small{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--card);border-color:var(--acc)}
.chip[aria-pressed="true"] small{color:var(--card)}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;font:inherit;color:var(--ink);text-align:start;width:100%;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card)}
.opt[aria-pressed="true"]{border-color:var(--acc);background:var(--accbg)}
.opt .s{flex:1}.opt .s span{display:block;font-size:13px;color:var(--muted)}
.grid7{display:grid;grid-template-columns:52px repeat(4,1fr) 56px;gap:4px;align-items:center;font-size:13px}
.grid7 .h{text-align:center;color:var(--muted);font-weight:600}
.grid7 .dn{font-weight:600;line-height:1.1}.grid7 .dn span{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.tg{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;min-height:40px;cursor:pointer}
.tg[aria-pressed="true"]{background:var(--badbg);border-color:var(--bad);color:var(--bad);font-weight:700}
.preview{white-space:pre-wrap;background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:14px;max-height:260px;overflow:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;text-decoration:none;text-align:center;flex:1;min-width:140px}
.btn.wa{background:#1f9d55;color:#fff}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.pri{background:var(--acc);color:var(--card)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.hint{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:18px}
.tw{overflow-x:auto}
.tabs{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{font:inherit;font-size:12px;font-weight:600;border:0;background:none;color:var(--muted);padding:8px 2px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--acc)}
button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sheet{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet .card{width:100%;max-width:520px;border-radius:18px 18px 0 0;max-height:80vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:10}
@media (max-width:420px){.now{grid-template-columns:1fr 1fr}.now .who{font-size:18px}th,td{font-size:14px}}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .15s ease}}
@keyframes fade{from{opacity:.6}to{opacity:1}}
.bot{position:fixed;inset:0;background:rgba(10,14,22,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.bot .panel{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.bot .hdr{display:flex;align-items:center;gap:10px;font-weight:700}
.bot .hdr img{width:36px;height:36px;border-radius:10px}
.bot .x{margin-inline-start:auto;font:inherit;font-size:22px;border:0;background:none;color:var(--muted);cursor:pointer}
.bmsg{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;max-width:92%;font-size:16px;line-height:1.55}
.bmsg.me{align-self:flex-end;background:var(--acc);color:var(--card);border-color:var(--acc);border-radius:16px 16px 4px 16px}
.bmsg .k{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:0 8px;font-weight:700}
.bchoices{display:flex;flex-wrap:wrap;gap:8px}
.bchoices button{font:inherit;font-weight:700;font-size:15px;border:1px solid var(--acc);background:var(--card);color:var(--acc);border-radius:999px;padding:9px 16px;cursor:pointer}
.bchoices button.go{background:var(--acc);color:var(--card)}
.ptr{font-size:34px;text-align:center;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.g2{grid-template-columns:74px repeat(4,1fr)}
.colb{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:4px 2px;cursor:pointer;line-height:1.1}
.colb small{display:block;font-size:10px;font-weight:400;color:var(--muted)}
.stick{position:sticky;top:0;z-index:3;background:var(--card);margin:0 -16px;padding:8px 16px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.meter{border-radius:10px;padding:8px 10px;display:grid;gap:6px;background:var(--soft);border:1px solid var(--line);transition:background .25s,border-color .25s}
.meter.ok{background:var(--goodbg);border-color:var(--good)}.meter.warn{background:var(--swapbg);border-color:var(--swap)}.meter.bad{background:var(--badbg);border-color:var(--bad)}
.mmsg{font-size:14px;font-weight:700;line-height:1.3}
.mbar{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--line)}
.mbar i{transition:width .25s}.mbar .m3{background:var(--bad)}.mbar .m2{background:var(--swap)}.mbar .m1{background:var(--good)}
.mrow{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.mc b{color:var(--ink);font-size:15px}.mc.over,.mc.over b{color:var(--bad)}
@keyframes mflash{0%{transform:scale(1.03)}100%{transform:scale(1)}}.meter.flash{animation:mflash .35s ease-out}
.msave{margin-inline-start:auto;font-size:12px}
.gaps{border-color:var(--bad)}
.wkbar{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}.wkbar span{margin-inline-end:auto}
.wkbar button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 10px;cursor:pointer}
.wkbar button[aria-pressed="true"]{background:var(--acc);color:var(--card);border-color:var(--acc)}
.lockbar{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--soft);border-radius:10px;padding:6px 10px}.lockbar span{margin-inline-end:auto}
.fairtop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}.fairtop b{font-weight:600;background:var(--soft);border-radius:999px;padding:3px 9px}.fairtop b.nx{background:var(--acc);color:var(--card)}
table.fairt td.hi,span.hi{color:var(--bad);font-weight:700}table.fairt td.lo,span.lo{color:var(--good);font-weight:700}table.fairt tr.avg th,table.fairt tr.avg td{color:var(--muted);font-size:12px}
.ftm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.ftm div{border-radius:10px;padding:6px 4px;text-align:center;background:var(--badbg);color:var(--bad)}
.ftm div.ok{background:var(--goodbg);color:var(--good)}.ftm b{display:block;font-size:14px}.ftm span{font-size:12px}
.fcards{display:grid;gap:8px;min-width:0}.fcard{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.fch{display:flex;align-items:center;gap:8px}.fch b{font-size:16px}.ftot{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--muted)}.ftot.full{background:var(--goodbg);color:var(--good);font-weight:700}
.frm{margin-inline-start:auto;font:inherit;font-size:12px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer}
.fst{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.fsc{border:1px solid var(--line);border-radius:10px;padding:3px 2px;text-align:center;min-width:0}.fsc.on{border-color:var(--good);background:var(--goodbg)}
.fsc span{display:block;font-size:12px;color:var(--muted)}.fsc div{display:flex;align-items:center;justify-content:space-between}
.fsc button{width:24px;height:24px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);font:inherit;font-size:16px;line-height:1;cursor:pointer;padding:0}.fsc button:disabled{opacity:.35}
.fsc b{font-size:15px}
.list li.grow{display:grid;gap:8px;align-items:start}
.ghd{display:flex;align-items:baseline;gap:8px;font-size:17px}.gk{font-size:12px;color:var(--muted);background:var(--soft);border-radius:999px;padding:2px 8px}
.gchs{display:flex;flex-wrap:wrap;gap:6px}.gch{font-size:12px;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--muted)}.gch.ok{background:var(--goodbg);color:var(--good);font-weight:700}
.gnote{margin:0;font-size:13px;color:var(--muted)}
.gwarn{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--badbg);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--bad)}
.gacts{display:flex;flex-wrap:wrap;gap:6px}
.ga{font:inherit;font-size:12.5px;color:var(--acc);text-decoration:none;white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer}
.ga.on{background:var(--goodbg);color:var(--good);border-color:var(--good);font-weight:700}.ga.dim{color:var(--muted)}
.cal.on{background:var(--goodbg);color:var(--good);border-color:var(--good)}
tr.offrow td{text-align:start;background:var(--bg);padding:4px 8px 8px;border-top:0}
.offrow .ol{font-size:12px;color:var(--muted);margin-inline-end:6px}
.oc{display:inline-block;font-size:12px;border-radius:999px;padding:2px 8px;margin:2px;background:var(--soft);color:var(--ink)}
.oc.ok{background:var(--goodbg);color:var(--good);font-weight:700}.oc.bad{background:var(--badbg);color:var(--bad);font-weight:700}
td.fair{background:var(--soft);outline:2px dashed var(--acc);outline-offset:-3px}td.fair small{display:block;font-size:10px;color:var(--acc);font-weight:700}
.fairc{border-color:var(--acc)}.fairrow{display:grid;grid-template-columns:70px 1fr;gap:8px;border-top:1px solid var(--line);padding-top:8px;font-size:14px}
.shabt td{font-size:12px;line-height:1.35;white-space:nowrap}.shabt td b{color:var(--ink)}.shabt td span{color:var(--muted)}
.flist{display:grid;gap:6px}.frow{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:6px}.frow.on{border-color:var(--good);background:var(--goodbg)}
.fhd{display:flex;justify-content:space-between;align-items:center}
.step{display:flex;align-items:center;gap:10px}.step button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);font:inherit;font-size:18px;cursor:pointer}
.fdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.fdays button{font:inherit;font-size:13px;padding:6px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.fdays button[aria-pressed="true"]{background:var(--good);color:var(--card);border-color:var(--good);font-weight:700}
.gmini{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;direction:rtl}
.gm{display:grid;gap:2px;text-align:center;font-size:11px;color:var(--muted)}.gm i{display:block;height:9px;border-radius:2px;background:var(--line)}.gm i.x{background:var(--bad)}
.gaprow{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:start;border-top:1px solid var(--line);padding-top:8px}
.gapk{font-size:13px;color:var(--muted)}.gapk b{display:block;color:var(--bad);font-size:15px}

function BOOT(DATA){
document.getElementById("app").hidden = false;


// ---------- model ----------
const SH = ["בוקר","צהריים","ערב","לילה"];
const DAYN = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
// a post starts 15 min early when its roster says so (06:45 instead of 07:00); hours come from each week's roster
const EARLY = Object.fromEntries(DATA.posts.map(p => [p.name, /^06:45/.test(p.rows[0][1] || "")]));
const START = [7,13,19,25];
const pad = n => String(n).padStart(2,"0");
const W0 = new Date(DATA.week_start + "T00:00:00");
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const dm = d => d.getDate() + "." + (d.getMonth()+1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nameOf = c => typeof c === "string" ? c : c.t;
const posts = DATA.posts;
const firstTok = s => s.split(/[ ,]/)[0].replace("יי","י");
const same = (a,b) => a === b || firstTok(a) === firstTok(b);

function slotTime(post, day, s){
  // wall-clock hours, so the DST change (25.10) does not shift shifts by an hour
  const y = W0.getFullYear(), m = W0.getMonth(), d = W0.getDate() + day;
  const start = EARLY[post] ? new Date(y, m, d, START[s] - 1, 45) : new Date(y, m, d, START[s], 0);
  const end = new Date(y, m, d, START[s] + 6, 0);
  return {start, end};
}
const hhmm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
const hoursTxt = (post, day, s) => { const t = slotTime(post, day, s); return hhmm(t.start) + "-" + hhmm(t.end); };

// every shift in the week, flattened
const SLOTS = [];
posts.forEach(p => p.rows.slice(0,4).forEach((row, s) => row[2].forEach((c, day) => {
  const t = slotTime(p.name, day, s);
  if (nameOf(c) !== "—") SLOTS.push({post:p.name, color:p.color, day, s, who:nameOf(c), cell:c, ...t});
})));
// roster names, plus commanders and floaters from the directory (22.11 Moshe; 23.11 new floaters with no shifts yet can still verify)
const PEOPLE = [...new Set([...posts.flatMap(p => p.rows.flatMap(r => r[2].flatMap(c => nameOf(c).split(", ")))), ...((DATA.dir || {}).people || []).filter(p => (p.type === "commander" || p.type === "floater") && !p.left).map(p => p.n)])].filter(n => n && n !== "—").sort((a,b)=>a.localeCompare(b,"he"));
const postOf = name => { for (const p of posts) if (p.rows.some(r => r[2].some(c => nameOf(c).split(", ").some(n => same(n,name))))) return p.name; return ""; };
const isWeekend = (day, s) => day >= 5 || (day === 4 && s >= 2);
const myShifts = me => SLOTS.filter(x => same(x.who, me)).sort((a,b)=>a.start-b.start);
SLOTS.forEach(x => x.base = W0);
function buildSlots(P, base){
  const early = Object.fromEntries(P.map(p => [p.name, /^06:45/.test(p.rows[0][1] || "")]));
  const out = [];
  P.forEach(p => { if (p.missing) return; p.rows.slice(0,4).forEach((row, s) => row[2].forEach((c, day) => {
    const y = base.getFullYear(), m = base.getMonth(), d = base.getDate() + day;
    const start = early[p.name] ? new Date(y, m, d, START[s] - 1, 45) : new Date(y, m, d, START[s], 0);
    if (nameOf(c) !== "—") out.push({post:p.name, color:p.color, day, s, who:nameOf(c), cell:c, start, end:new Date(y, m, d, START[s] + 6, 0), base});
  })); });
  return out;
}
const WEEKS = {cur: {P: DATA.posts, base: W0, slots: SLOTS}};
if (DATA.next) { const NB = new Date(DATA.next.week_start + "T00:00:00"); WEEKS.next = {P: DATA.next.posts, base: NB, slots: buildSlots(DATA.next.posts, NB)}; }
// personal screens look at both published weeks, so the new week shows up the moment it is published, not on Sunday
const myUpcoming = n => [...WEEKS.cur.slots, ...((WEEKS.next || {}).slots || [])].filter(x => same(x.who, n)).sort((a, b) => a.start - b.start);
let swapWeek = "cur";
const WK_ = () => WEEKS[swapWeek] || WEEKS.cur;
const shiftsW = n => WK_().slots.filter(x => same(x.who, n)).sort((a,b) => a.start - b.start);
const peopleW = () => [...new Set(WK_().P.flatMap(p => p.rows.flatMap(r => r[2].flatMap(c => nameOf(c).split(", ")))))].filter(n => n && n !== "—").sort((a,b) => a.localeCompare(b,"he"));
const postOfW = name => { for (const p of WK_().P) if (!p.missing && p.rows.slice(0,4).some(r => r[2].some(c => nameOf(c).split(", ").some(n => same(n, name))))) return p.name; return ""; };

// ---------- state ----------
const store = { get(k,d){ try { const v = localStorage.getItem("bz_"+k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
                set(k,v){ try { localStorage.setItem("bz_"+k, JSON.stringify(v)); } catch(e){} } };
let me = store.get("me", "");
let tab = store.get("tab", "now");
const nowD = new Date();
let day = (nowD >= W0 && nowD < addDays(W0,7)) ? Math.floor((nowD - W0) / 864e5) : 0;
let askMode = "swap";

const view = document.getElementById("view");
document.getElementById("weeklbl").textContent = "שבוע " + dm(W0) + " עד " + dm(addDays(W0,6)) + " · עודכן " + DATA.updated;

function toast(t){ const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(()=>el.remove(), 1800); }
async function copy(text){
  try { await navigator.clipboard.writeText(text); toast("הועתק"); }
  catch(e){ const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast("הועתק"); }catch(_){ toast("סמן והעתק ידנית"); } ta.remove(); }
}
const waLink = text => "https://wa.me/?text=" + encodeURIComponent(text);

// ---------- who am I ----------
function pickMe(){
  const sh = document.createElement("div"); sh.className = "sheet";
  sh.innerHTML = `<div class="card"><h2>מי אתה?</h2><p class="hint">נשמר רק בטלפון שלך. בלי סיסמה.</p>
    <div class="chips">${PEOPLE.map(n=>`<button type="button" class="chip" aria-pressed="${n===me}">${esc(n)} <small>${esc(postOf(n))}</small></button>`).join("")}</div>
    <button type="button" class="btn sec" id="closeMe">סגור</button></div>`;
  document.body.appendChild(sh);
  sh.querySelectorAll(".chip").forEach((b,i)=>b.onclick=()=>{ me = PEOPLE[i]; store.set("me", me); sh.remove(); render();
    if (typeof canVerify === "function" && canVerify() && !store.get("k", "")) verifySheet(canonN(me)); });
  sh.querySelector("#closeMe").onclick = () => sh.remove();
  sh.onclick = e => { if (e.target === sh) sh.remove(); };
}
document.getElementById("mebtn").onclick = () => { tab = "settings"; render(); window.scrollTo(0, 0); };

// ---------- views ----------
// Home-screen alerts live for 24 hours from the WhatsApp message behind them; the table keeps its markings.
const fresh = t => { const ts = (DATA.alertTs || {})[t]; return !!ts && Date.now()/1000 - ts < 86400; };
function viewNow(){
  const now = new Date();
  let h = "";
  const aboutMe = t => !!me && t.split(/[\s,←:()·]+/).some(w => w.length > 1 && same(w, me));
  const recent = DATA.applied.filter(fresh).filter(aboutMe), liveNew = (DATA.liveChanges || []).filter(fresh).filter(aboutMe), flagsNew = [];
  if (recent.length) h += `<div class="alert sw"><b>${recent.length === 1 ? "החלפה שנוגעת אליך" : recent.length + " החלפות שנוגעות אליך"}</b>, כבר בטבלה (בכתום).<ul>${recent.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>`;
  if (liveNew.length) h += `<div class="alert lv"><b>שינוי במשמרת שלך לפי הדיווח בשטח</b><ul>${liveNew.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>`;
  if (flagsNew.length) h += `<div class="alert bad"><b>לבדיקה מול ראש הצוות</b> (לא עודכן בטבלה)<ul>${flagsNew.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>`;

  const on = posts.map(p => SLOTS.find(x => x.post === p.name && x.start <= now && now < x.end));
  if (on.some(Boolean)) {
    h += `<h2>במשמרת עכשיו</h2><div class="now">` + posts.map((p,i)=>{ const x = on[i];
      return `<div class="card"><div class="post"><i class="dot" style="background:var(${p.color})"></i>${esc(p.name)}</div>
        <div class="who">${x ? `<span class="n${same(x.who,me)?" me":""}">${esc(x.who)}</span>` : (p.missing ? `<span style="font-size:14px;color:var(--faint);font-weight:400">סידור לא פורסם</span>` : "—")}</div>
        <div class="till">${x ? SH[x.s] + " · עד " + hhmm(x.end) : ""}</div>
        ${x ? (() => { const L = (DATA.live || {})[`${x.post}|${x.day}|${x.s}`]; return L ? `<div class="ok-ck">${L.match ? "✓ דיווח" : "⇄ שונה בדיווח"} ${L.time}</div>` : `<div class="till">עוד לא דיווח</div>`; })() : ""}</div>`; }).join("") + `</div>`;
  } else {
    const before = SLOTS.length && now < Math.min(...SLOTS.map(x => x.start));
    h += `<div class="card"><h2>${before ? "הסידור מתחיל ביום ראשון " + dm(W0) : "השבוע הזה הסתיים"}</h2><p class="hint">${before ? "הנה מי פותח:" : "מחכה לסידור החדש."}</p>
      ${before ? `<div class="now">${posts.map(p=>{ const x = SLOTS.find(y=>y.post===p.name && y.day===0 && y.s===0);
        return `<div class="card"><div class="post"><i class="dot" style="background:var(${p.color})"></i>${esc(p.name)}</div><div class="who">${x ? esc(x.who) : `<span style="font-size:14px;color:var(--faint);font-weight:400">סידור לא פורסם</span>`}</div><div class="till">${x ? "מ־" + hhmm(x.start) : ""}</div></div>`; }).join("")}</div>` : ""}</div>`;
  }

  if (me) {
    const next = myUpcoming(me).find(x => x.end > now);
    if (next) {
      const hrs = Math.max(0, (next.start - now) / 36e5);
      const when = next.start <= now ? "עכשיו במשמרת" : hrs < 24 ? `בעוד ${Math.floor(hrs)} ש׳ ${Math.round((hrs%1)*60)} ד׳` : (d => d === 1 ? "בעוד יום" : d === 2 ? "בעוד יומיים" : `בעוד ${d} ימים`)(Math.round(hrs/24));
      h += `<div class="card"><h3>המשמרת הבאה שלך</h3><div class="big">${DAYN[next.day]} ${dm(addDays(next.base || W0, next.day))} · ${SH[next.s]}</div>
        <div class="hint"><i class="dot" style="background:var(${next.color})"></i> עמדה ${esc(next.post)} · ${hhmm(next.start)}-${hhmm(next.end)} · <b>${when}</b></div></div>`;
    } else h += `<div class="card"><h3>המשמרת הבאה שלך</h3><p class="hint">${WEEKS.next ? "אין לך משמרות השבוע ובשבוע הבא." : "אין לך עוד משמרות השבוע. הסידור לשבוע הבא עוד לא פורסם."}</p></div>`;
  } else h += `<button type="button" class="btn pri" id="setme">בחר את השם שלך כדי לראות את המשמרות שלך</button>`;
  view.innerHTML = h;
  const sm = document.getElementById("setme"); if (sm) sm.onclick = pickMe;
}

let wk = "cur";   // "cur" | "next"
// Team filter (Nitzan, 23.11): "all posts, one day" or one team's post for the whole week, like the team's own roster image.
// A team's post this week = the post where most of its core guards are written.
let rteam = store.get("rteam", null);
function teamPosts(P){
  const out = {};
  for (const t of [...new Set(DIR.people.filter(x => x.team).map(x => x.team))]) {
    let best = null, bc = 0;
    for (const p of P) { if (p.missing) continue;
      const names = new Set(p.rows.slice(0, 4).flatMap(r => r[2].flatMap(c => nameOf(c).split(", "))).map(canonN));
      const c = DIR.people.filter(x => x.team === t && (x.type === "core" || x.type === "lead") && names.has(x.n)).length;
      if (c > bc) { bc = c; best = p; } }
    if (best) out[t] = best;
  }
  return out;
}
function teamWeekHTML(p, B, today){
  let h = `<div class="card flush"><div class="tw"><table class="twk"><thead><tr><th><i class="dot" style="background:var(${p.color})"></i>${esc(p.name)}</th>${DAYN.map((d, i) => { const dt = addDays(B, i), isT = today >= dt && today < addDays(dt, 1);
    return `<th class="${isT ? "tday" : ""}">${"אבגדהוש"[i]}׳<small>${dm(dt)}</small></th>`; }).join("")}</tr></thead><tbody>`;
  for (let r = 0; r < 5; r++) {
    h += `<tr class="${r === 4 ? "off" : ""}"><th>${r < 4 ? SH[r] : "חופש"}${r < 4 ? `<small>${["07-13","13-19","19-01","01-07"][r]}</small>` : ""}</th>`;
    for (let d = 0; d < 7; d++) { const c = p.rows[r][2][d], t = nameOf(c), cls = typeof c === "string" ? "" : (c.c === "swap" ? "sw" : c.c === "live" ? "lv" : "nt");
      h += `<td class="${cls}"${typeof c === "string" ? "" : ` data-why="${esc(c.m)}"`}>${t.split(", ").filter(Boolean).map(n => `<span class="n${me && same(n, me) ? " me" : ""}">${esc(n)}</span>`).join("<br>") || "·"}</td>`; }
    h += `</tr>`;
  }
  return h + `</tbody></table></div></div>`;
}
function viewWeek(){
  const today = new Date(), N = DATA.next, NW = addDays(W0, 7);
  let h = `<div class="seg" role="tablist"><button type="button" role="tab" data-w="cur" aria-selected="${wk!=="next"}">השבוע · ${dm(W0)}</button><button type="button" role="tab" data-w="next" aria-selected="${wk==="next"}">שבוע הבא · ${dm(NW)}</button></div>`;
  if (wk === "next" && !N) {
    view.innerHTML = h + `<div class="card" style="text-align:center;align-items:center;padding:28px 16px"><h2>הסידור לשבוע הבא עוד לא פורסם</h2>
      <p class="hint">${dm(NW)} עד ${dm(addDays(NW,6))}. הסידור מתפרסם בדרך כלל ברביעי או חמישי בקבוצת "דיון חופשי", ויופיע כאן אוטומטית.</p></div>`;
    view.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { wk = b.dataset.w; viewWeek(); });
    return;
  }
  const isNext = wk === "next" && N, P = isNext ? N.posts : posts, B = isNext ? new Date(N.week_start + "T00:00:00") : W0;
  if (isNext && N.posts.some(p => p.missing)) h += `<p class="hint">חלק מהעמדות עוד לא פורסמו: ${N.posts.filter(p=>p.missing).map(p=>esc(p.name)).join(", ")}.</p>`;
  const wnote = isNext ? N.note : DATA.note;

function parseCons(text){
  const res = {};   // name -> Set("d-s")
  for (const b of text.split(/פורמט אילוצים/).slice(1)) {
    const nm = (b.match(/שם\s*:\s*(.+)/) || [])[1]; if (!nm) continue;
    const set = res[nm.trim()] = res[nm.trim()] || new Set();
    for (const line of b.split("\n")) {
      if (!/לא יכול/.test(line)) continue;
      let d = DAYN.findIndex(n => line.includes(n));
      const md = line.match(/(\d{1,2})\.(\d{1,2})/);
      if (md) { const dt = new Date(NW0.getFullYear(), +md[2]-1, +md[1]); const k = Math.round((dt - NW0)/864e5); if (k >= 0 && k < 7) d = k; }
      if (d < 0) continue;
      const ss = /כל היום/.test(line) ? [0,1,2,3] : [0,1,2,3].filter(s => line.includes(SH[s]) || (s===1 && line.includes("צהרים")));
      ss.forEach(s => set.add(d+"-"+s));
    }
  }
  return res;
}
// This week's load per person, so next week evens it out (nights, weekends, rest across Saturday night)
function carry(n){
  const m = myShifts(n);
  const last = m.length ? m[m.length-1] : null;
  return { nt: m.filter(x=>x.s===3).length, we: m.filter(x=>isWeekend(x.day,x.s)).length,
           lastEnd: last ? (last.end - NW0) / 36e5 : -99 };     // hours relative to next Sunday 00:00
}
function buildRoster(team, consMap, minRest){
  const slots = []; for (let d = 0; d < 7; d++) for (let s = 0; s < 4; s++) slots.push({d, s, st: d*24 + START[s], en: d*24 + START[s] + 6, we: isWeekend(d, s)});
  const blocked = (n, k) => Object.entries(consMap).some(([cn, set]) => same(cn, n) && set.has(k));
  const C = Object.fromEntries(team.map(n => [n, carry(n)]));
  const avgNt = team.reduce((a,n)=>a+C[n].nt,0)/team.length, avgWe = team.reduce((a,n)=>a+C[n].we,0)/team.length;
  const var_ = a => { const m = a.reduce((p,c)=>p+c,0)/a.length; return a.reduce((p,c)=>p+(c-m)**2,0); };
  // full score of an assignment: hard rules first, then fairness (counting this week's carry-over)
  function evaluate(out){
    const st = Object.fromEntries(team.map(n => [n, {cnt:0, nt:0, we:0, days:new Set(), shifts:[]}]));
    let hard = 0, soft = 0; const warns = [];
    out.forEach((n, i) => { if (n === "—") { hard++; warns.push(`${DAYN[slots[i].d]} ${SH[slots[i].s]}: לא שובץ אף אחד`); return; }
      const sl = slots[i], x = st[n];
      if (blocked(n, sl.d+"-"+sl.s)) { hard++; warns.push(`${n}: ${DAYN[sl.d]} ${SH[sl.s]} נגד אילוץ`); }
      if (x.days.has(sl.d)) { hard++; warns.push(`${n}: שתי משמרות ב${DAYN[sl.d]}`); }
      x.days.add(sl.d); x.cnt++; if (sl.s===3) x.nt++; if (sl.we) x.we++; x.shifts.push(sl); });
    for (const n of team) {
      const sh = st[n].shifts.sort((a,b)=>a.st-b.st); let prevEnd = C[n].lastEnd, prevNight = false, run = 0;
      for (const sl of sh) {
        const gap = sl.st - prevEnd;
        if (gap < minRest) { hard++; warns.push(`${n}: רק ${Math.round(gap)} ש׳ מנוחה לפני ${DAYN[sl.d]} ${SH[sl.s]}`); }
        else if (gap < 16) soft += 2;                                   // legal but short turnaround
        run = sl.s===3 && prevNight ? run + 1 : (sl.s===3 ? 1 : 0); if (run >= 3) soft += 6;   // 3 nights in a row
        prevNight = sl.s === 3 && gap < 30; prevEnd = sl.en;
      }
    }
    const v = team.map(n => st[n]);
    soft += var_(v.map(x=>x.cnt))*6 + var_(v.map((x,i)=>x.nt + C[team[i]].nt - avgNt))*4 + var_(v.map((x,i)=>x.we + C[team[i]].we - avgWe))*3;
    return { cost: hard*1000 + soft, hard, warns, st };
  }
  // 1) many randomized greedy starts  2) improve the best by swapping people between slots
  let best = null;
  for (let run = 0; run < 150; run++) {
    const st = Object.fromEntries(team.map(n => [n, {cnt:0, nt:C[n].nt, we:C[n].we, last:C[n].lastEnd, days:new Set()}]));
    const out = slots.map(sl => {
      const pool = team.filter(n => !blocked(n, sl.d+"-"+sl.s) && !st[n].days.has(sl.d) && sl.st - st[n].last >= minRest);
      if (!pool.length) return "—";
      const sc = n => st[n].cnt*10 + (sl.s===3 ? st[n].nt*8 : 0) + (sl.we ? st[n].we*6 : 0) + Math.random()*5;
      const n = pool.sort((a,b)=>sc(a)-sc(b))[0], x = st[n];
      x.cnt++; if (sl.s===3) x.nt++; if (sl.we) x.we++; x.last = sl.en; x.days.add(sl.d); return n;
    });
    const e = evaluate(out);
    if (!best || e.cost < best.cost) best = {...e, out};
  }
  for (let it = 0; it < 4000; it++) {
    const out = best.out.slice(), i = Math.floor(Math.random()*out.length);
    if (Math.random() < 0.5) { const j = Math.floor(Math.random()*out.length); [out[i], out[j]] = [out[j], out[i]]; }
    else out[i] = team[Math.floor(Math.random()*team.length)];
    const e = evaluate(out); if (e.cost <= best.cost) best = {...e, out};
  }
  best.carry = C;
  return best;
}

// ---- emergency pool: who can take a shift, in the order to ask ----
function weekOf(x){ return (x.base && WEEKS.next && +x.base === +WEEKS.next.base) ? WEEKS.next : WEEKS.cur; }
function poolFor(x, who){
  const W = weekOf(x), sl = W.slots;
  const shiftsOf = n => sl.filter(y => same(y.who, n));
  const myTeam = (dirOf(who) || {}).team || TEAM_LABEL;
  const names = [...new Set([...sl.map(y => canonN(y.who)), ...DIR.people.filter(p => !p.left).map(p => p.n)])].filter(n => n && n !== "—" && !same(n, who));
  const out = [];
  for (const n of names) {
    const P = dirOf(n); if (P && P.left) continue;
    const mine = shiftsOf(n);
    if (mine.some(y => y.day === x.day)) continue;
    const gap = Math.min(...mine.map(y => y.end <= x.start ? (x.start - y.end) / 36e5 : y.start >= x.end ? (y.start - x.end) / 36e5 : 0), 99);
    const av = availOf(n, x); if (av === 3) continue;
    const L = ledgerOf(n);
    let tier = 3, why = [];
    if (gap < 8) { tier = 6; why.push(`⚠ רק ${Math.round(gap)} שעות מנוחה`); }
    if (tier === 6) { /* short rest: last resort whatever the team */ }
    else if (P && P.team === myTeam && P.type === "core") { tier = 1; why.push("מהצוות, ביום חופש"); }
    else if (P && P.type === "floater") { tier = 2; why.push("מתגבר"); }
    else { const off = W.P.some(p => !p.missing && nameOf(p.rows[4][2][x.day]).split(", ").some(o => same(o, n))); if (!off && P) continue; why.push(P ? `צוות ${P.team || "?"}, ביום חופש` : "ביום חופש"); }
    if (mine.length >= 5 && tier !== 6) { why.push("כבר 5 משמרות: רק בהסכמה"); tier = 5; }
    why.push(`${mine.length} משמרות השבוע`); if (tier !== 6) why.push(gap >= 24 ? "לא צמוד למשמרת אחרת" : `${Math.round(gap)} ש׳ מנוחה`);
    if (x.s === 3) why.push(`${L.nt} לילות ב־${LED.weeks.length} שבועות`);
    if (av === 1) why.unshift("ביקש את המשמרת הזאת"); if (av === 2) why.push("סימן \"מעדיף שלא\"");
    out.push({n, tier, why, score: tier * 100 + mine.length * 10 + (x.s === 3 ? L.nt : L.sh / 4) + (av === 1 ? -60 : av === 2 ? 30 : 0)});
  }
  return out.sort((a, b) => a.score - b.score);
}

    ${d.people.map(p => `<tr><th>${esc(p.n)}${p.kind === "floater" ? "<small>מתגבר</small>" : ""}</th><td>${p.cnt}</td><td>${p.nt}<small>${p.led.nt} ב־${LED.weeks.length} שב׳</small></td><td>${p.fri}</td><td>${p.sat}<small>${p.led.sat} ב־${LED.weeks.length} שב׳</small></td><td>${(o => `${o.off.length}<small>${o.off.map(d1).join(" ")}${o.asked.length ? `<br>ביקש: ${o.asked.map(dd => d1(dd) + (o.got.includes(dd) ? "✓" : "✗")).join(" ")}` : ""}</small>`)(offOf(d, d.people.indexOf(p)))}</td></tr>`).join("")}</tbody></table></div></div>`;
  t += `<div class="card"><h3>למה כל אחד קיבל את מה שקיבל</h3>${d.people.filter(p => p.cnt).map(p => `<p class="hint"><b>${esc(p.n)}:</b> ${p.pref ? `קיבל ${p.got.length} מתוך ${p.pref} "מעדיף". ` : ""}${p.broke.length ? `"מעדיף שלא" שנשבר: ${p.broke.join(", ")} (אין חלופה בלי לשבור חוק). ` : ""}לילות ב־${LED.weeks.length} שבועות: ${p.led.nt}. ${p.shabNow.length ? `שבת: ${p.shabNow.map(slotTxt).join(", ")}${p.shab && p.shab.ago != null ? ` (קודם: לפני ${p.shab.ago} שבועות)` : ""}.` : p.shab && p.shab.ago === 1 ? "לא בשבת, כי היה בשבוע שעבר." : ""}${p.kind === "core" ? (p.off >= 3 ? " 3 ימי חופש השבוע." : "") : " מתגבר."}${((GDOCS[p.n] || {}).prof || {}).note ? ` 💬 "${esc(GDOCS[p.n].prof.note)}"` : ""}</p>`).join("")}</div>`;
  const txt = draftText(d);
  t += `<div class="card"><h3>טיוטה, לא פורסם</h3><div class="actions"><a class="btn wa" target="_blank" rel="noopener" href="${waLink(txt)}">שלח בוואטסאפ</a><button type="button" class="btn sec" id="acp">העתק</button><button type="button" class="btn sec" id="asave">שמור טיוטה</button></div>
    <p class="hint">שלב 0: הטיוטה לא מחליפה את הסידור של אלירן. משווים מולו שבועיים.</p></div>`;
  el.innerHTML = t;
  document.getElementById("acp").onclick = () => copy(txt);
  document.getElementById("asave").onclick = () => { ADOC.drafts = ADOC.drafts || {}; ADOC.drafts[d.ws] = {post: d.post, names: d.names, out: d.out, kpi: d.kpi, at: new Date().toISOString()}; saveAdmin(); };
}

// ---------- install bot: walks a guard through putting the app on the home screen ----------
const UA = navigator.userAgent || "";
const ENV = {
  standalone: matchMedia("(display-mode: standalone)").matches || navigator.standalone === true,
  ios: /iPhone|iPad|iPod/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1),
  android: /Android/.test(UA),
  inApp: /WhatsApp|FBAN|FBAV|Instagram|Line\//.test(UA),
  iosOther: /CriOS|FxiOS|EdgiOS/.test(UA),
  web: /^https?:$/.test(location.protocol)
};
function installBot(){
  if (document.getElementById("bot")) return;
  const el = document.createElement("div"); el.className = "bot"; el.id = "bot";
  el.innerHTML = `<div class="panel" role="dialog" aria-label="בוט ההתקנה"><div class="hdr"><img src="icon-192.png" alt="">בוט ההתקנה<button class="x" type="button" aria-label="סגירה">✕</button></div><div id="bchat" style="display:flex;flex-direction:column;gap:10px"></div></div>`;
  document.body.appendChild(el);
  const chat = el.querySelector("#bchat");
  el.querySelector(".x").onclick = () => el.remove();
  el.onclick = e => { if (e.target === el) el.remove(); };
  const say = (html, me) => { const m = document.createElement("div"); m.className = "bmsg" + (me ? " me" : ""); m.innerHTML = html; chat.appendChild(m); m.scrollIntoView({block:"end", behavior:"smooth"}); };
  const ask = choices => { const c = document.createElement("div"); c.className = "bchoices";
    choices.forEach(([label, fn, go]) => { const b = document.createElement("button"); b.type = "button"; b.textContent = label; if (go) b.className = "go";
      b.onclick = () => { c.remove(); say(esc(label), true); setTimeout(fn, 250); }; c.appendChild(b); }); chat.appendChild(c); c.scrollIntoView({block:"end"}); };
  const done = () => { say("מעולה! 🎉 מעכשיו מוצאים את <b>בונקר</b> על מסך הבית, ופותחים כמו כל אפליקציה. הכל מתעדכן לבד מקבוצות הוואטסאפ."); ask([["סגור", () => el.remove(), true]]); };
  const stuck = () => { say("אין בעיה. אפשר גם לשלוח לניצן צילום מסך ונסדר ביחד 🙂"); ask([["נסה שוב מההתחלה", start], ["סגור", () => el.remove()]]); };
  const iosSteps = () => {
    say(`1️⃣ לחץ על כפתור <span class="k">שיתוף ⬆</span> בתחתית המסך (באייפד: למעלה).`);
    say(`<div class="ptr">⬇</div>`);
    ask([["מצאתי ✓", () => { say(`2️⃣ גלול קצת למטה ובחר <span class="k">הוספה למסך הבית ⊞</span>`);
      ask([["בחרתי ✓", () => { say(`3️⃣ לחץ <span class="k">הוספה</span> למעלה בצד ימין.`); ask([["הוספתי ✓", done, true], ["לא מוצא", stuck]]); }, true], ["לא מוצא", stuck]]); }, true], ["לא מוצא", stuck]]);
  };
  const androidSteps = () => {
    if (window.__bip) {
      say("בטלפון שלך אפשר להתקין בלחיצה אחת 👇");
      ask([["📲 התקן עכשיו", async () => { try { window.__bip.prompt(); const r = await window.__bip.userChoice; window.__bip = null;
        if (r.outcome === "accepted") done(); else { say("ההתקנה בוטלה. רוצה לנסות שוב?"); ask([["כן", androidSteps, true], ["סגור", () => el.remove()]]); } } catch(e) { manualAndroid(); } }, true]]);
    } else manualAndroid();
  };
  const manualAndroid = () => {
    say(`1️⃣ לחץ על <span class="k">⋮</span> למעלה בפינה.`);
    ask([["לחצתי ✓", () => { say(`2️⃣ בחר <span class="k">התקנת אפליקציה</span> (או <span class="k">הוספה למסך הבית</span>), ואז <span class="k">התקנה</span>.`);
      ask([["התקנתי ✓", done, true], ["לא מוצא", stuck]]); }, true], ["לא מוצא", stuck]]);
  };
  const openInBrowser = () => {
    if (ENV.ios) say(`פתחת את הלינק מתוך וואטסאפ. כדי לשמור צריך לעבור ל־Safari:<br>לחץ על <span class="k">⋯</span> או על סמל המצפן 🧭 בתחתית, ובחר <span class="k">פתח ב־Safari</span>.`);
    else say(`פתחת את הלינק מתוך וואטסאפ. כדי לשמור צריך לעבור ל־Chrome:<br>לחץ על <span class="k">⋮</span> למעלה ובחר <span class="k">פתח ב־Chrome</span>.`);
    say("שם תצטרך להקליד את הקוד פעם אחת, ואז תפתח אותי שוב מהכפתור הכחול 📲");
    ask([["עברתי לדפדפן ✓", () => { say("מעולה, אז משם ממשיכים 👍"); ask([["סגור", () => el.remove(), true]]); }, true], ["לא מצליח", stuck]]);
  };
  function start(){
    chat.innerHTML = "";
    say("היי 👋 אני בוט ההתקנה. תוך 20 שניות האפליקציה תהיה על מסך הבית שלך, כמו כל אפליקציה.");
    if (ENV.standalone) { say("נראה שהאפליקציה כבר מותקנת אצלך ✅ אין מה לעשות."); ask([["סגור", () => el.remove(), true]]); return; }
    if (ENV.inApp) { openInBrowser(); return; }
    if (ENV.ios && ENV.iosOther) { say("באייפון שומרים דרך <b>Safari</b>. העתק את הלינק ופתח אותו ב־Safari, ואז פתח אותי שוב."); ask([["סגור", () => el.remove(), true]]); return; }
    if (ENV.ios) { say("זיהיתי אייפון 📱 3 צעדים קצרים:"); iosSteps(); return; }
    if (ENV.android) { say("זיהיתי אנדרואיד 📱"); androidSteps(); return; }
    say("איזה טלפון יש לך?");
    ask([["אייפון", iosSteps, true], ["אנדרואיד", androidSteps, true]]);
  }
  start();
}
if (ENV.web && !ENV.standalone) {
  const bar = document.createElement("button"); bar.type = "button"; bar.className = "installbar"; bar.id = "installbar";
  bar.innerHTML = "📲 <span>שמור את האפליקציה בטלפון · בוט ההתקנה יעזור</span>";
  bar.onclick = installBot;
  document.querySelector(".wrap").insertBefore(bar, document.getElementById("view"));
  // first visit, or a link ending in #install: open the bot by itself
  let seenBot = store.get("botSeen", false);
  if (location.hash === "#install" || !seenBot) { store.set("botSeen", true); setTimeout(installBot, 600); }
}

// ---------- shell ----------
// scripts run: swap the pre-rendered roster for the interactive app
document.getElementById("static").hidden = true;
document.getElementById("tabs").hidden = false;
document.getElementById("mebtn").hidden = false;
const VIEWS = {now:viewNow, week:viewWeek, mine:viewMine, ask:viewSwap, cons:viewCons, plan:viewAdmin, settings:viewSettings};   // 2.0: plan = the scheduler, only with the scheduler link
if (ADMIN && FBC) { const tb = document.getElementById("tabs"); tb.style.gridTemplateColumns = "repeat(6,1fr)";

if (tab === "plan" && !(ADMIN && FBC)) tab = "now";
if (TOKEN && FBC) loadGuard();
function render(){
  document.getElementById("mebtn").textContent = "⚙ " + (me || "הגדרות");
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.t === tab));
  (VIEWS[tab] || viewNow)();
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.t; store.set("tab", tab); render(); window.scrollTo(0,0); });
render();
setInterval(() => { if (tab === "now") viewNow(); }, 60000);

}

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(enc, code){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64d(enc.salt), iterations:enc.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(enc.iv)}, key, b64d(enc.ct))));
}
const lsGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e) {} };
(async function start(){
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
  // Android/Chrome one-tap install: keep the browser's install prompt for the install bot
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.__bip = e; });
  const lock = document.getElementById("lock"), msg = document.getElementById("lockmsg");
  let enc;
  try { enc = await (await fetch("data.enc.json", {cache:"no-store"})).json(); }
  catch(e) { lock.hidden = false; msg.textContent = "אין חיבור לאינטרנט. נסו שוב בעוד רגע."; return; }
  // live: look for newer data every 2 minutes; reload quietly unless the person is mid-request
  const BUILD = "e39d1369f07c";
  const checkBuild = async () => { try { const v = (await (await fetch("version.txt", {cache:"no-store"})).text()).trim(); if (v && BUILD !== "__BUILD" + "__" && v !== BUILD) location.reload(); } catch(e) {} };
  document.addEventListener("visibilitychange", () => { if (!document.hidden) checkBuild(); });
  setInterval(checkBuild, 120000);
  setInterval(async () => {
    if (document.hidden) return;
    try { const n = await (await fetch("data.enc.json", {cache:"no-store"})).json();
      if (n.ct !== enc.ct) { const t = lsGet("bz_tab") || ""; if (!/ask|plan/.test(t)) location.reload();
        else if (!document.getElementById("upd")) { const b = document.createElement("button"); b.id = "upd"; b.className = "toast"; b.style.border = "0"; b.textContent = "יש עדכון בסידור · לחץ לרענון"; b.onclick = () => location.reload(); document.body.appendChild(b); } }
    } catch(e) {}
  }, 120000);
  const hc = new URLSearchParams(location.hash.slice(1)).get("c"); if (hc) lsSet("bz_code", hc);   // personal links carry the entry code
  const saved = lsGet("bz_code");
  if (saved) { try { BOOT(await decrypt(enc, saved)); return; } catch(e) {} }
  lock.hidden = false;
  document.getElementById("lockform").onsubmit = async ev => {
    ev.preventDefault();
    const code = document.getElementById("lockcode").value.trim(), btn = document.getElementById("lockbtn");
    btn.textContent = "בודק…";
    try { const data = await decrypt(enc, code); lsSet("bz_code", code); lock.hidden = true; BOOT(data); }
    catch(e) { btn.textContent = "כניסה"; msg.textContent = "הקוד לא נכון. נסו שוב."; msg.style.color = "var(--bad)"; }
  };
})();
